[project]
name = "ha-opcom-energy"
version = "1.0.1"
description = "Direct Romanian OPCOM day-ahead prices for Home Assistant"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Eduard Gaspar" }]

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.373", "ruff==0.14.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
